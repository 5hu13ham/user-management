name: Backend and frontend checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests with MongoDB
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: user-management-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: user-management-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
