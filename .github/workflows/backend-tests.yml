name: Backend and frontend checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests with MongoDB
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: user-management-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: user-management-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JWT_SECRET: ci-only-secret-1234567890123456789012345678901234567890
      BOOTSTRAP_ADMIN_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all services
        run: docker compose up --build -d
      - name: Verify API, OpenAPI spec and frontend
        run: |
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/api/ping > /dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          if [ "$ready" != "1" ]; then
            docker compose logs backend
            exit 1
          fi
          curl --fail --silent http://localhost:8080/v3/api-docs > /dev/null
          curl --fail --silent http://localhost:5173/ > /dev/null
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Shut down services
        if: always()
        run: docker compose down -v
