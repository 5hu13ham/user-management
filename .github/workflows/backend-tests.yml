name: Backend tests

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Maven unit and integration tests
        run: mvn -B -ntp test
