spring.application.name=user-management
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/user_management}
spring.data.mongodb.auto-index-creation=true
jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
